services:
  db:
    image: postgres:16-alpine
    container_name: tarefas_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tarefas
    ports:
      - "5432:5432"          # exposto pra voces conectarem com DBeaver/psql
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:             # a API so sobe depois que o banco aceita conexao
      test: ["CMD-SHELL", "pg_isready -U postgres -d tarefas"]
      interval: 5s
      retries: 10

  api:
    build: .
    container_name: tarefas_api
    env_file: .env
    environment:
      # dentro da rede do compose o host do banco e "db", nao "localhost"
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/tarefas
    ports:
      - "8000:8000"
    volumes:
      - ./app:/code/app      # hot reload: editou o arquivo, a API reinicia
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pgdata:
